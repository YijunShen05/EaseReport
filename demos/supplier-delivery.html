function valid(r,m){return typeof r[m.field]==='number'&&Number.isFinite(r[m.field])&&(!m.statusField||r[m.statusField]===m.validStatus);}

const pages=Math.ceil(a.rows.length/pageSize);state.page=Math.min(state.page,Math.max(0,pages-1));$('tableStatus').textContent='命中 '+a.rows.length+' 条'+(C?' · 同项有效 '+a.pairs.length+' 条':'');$('tableBody').replaceChildren();const count=D.columns.length+(C?1:0)+1;
for(const row of a.rows.slice(state.page*pageSize,(state.page+1)*pageSize)){const id=String(row[D.idField]),index=D.rows.indexOf(row),tr=e('tr');tr.dataset.rowId=id;for(const c of D.columns){const value=row[c.field];tr.append(e('td',typeof value==='number'?number(value):field(row,c.field),c.numeric?'number':''));}if(C)tr.append(e('td',difference(row)===null?'不适用':number(difference(row)), 'number'));const td=e('td'),button=e('button',expanded.has(id)?'收起证据':'展开证据');button.type='button';button.setAttribute('aria-expanded',String(expanded.has(id)));button.setAttribute('aria-controls','detail-'+index);button.onclick=()=>{expanded.has(id)?expanded.delete(id):expanded.add(id);render();};td.append(button);tr.append(td);$('tableBody').append(tr);const detail=e('tr');detail.id='detail-'+index;detail.hidden=!expanded.has(id);const cell=e('td',undefined,'detail-cell');cell.colSpan=count;cell.append(e('p',reason(row)),e('p',D.detailsField?field(row,D.detailsField):'未提供额外说明。'));if(D.sourcesField){for(const source of row[D.sourcesField]||[]){try{const url=new URL(source.url);if(!['https:','http:'].includes(url.protocol))continue;const link=e('a',source.label||'资料来源');link.href=url.href;link.target='_blank';link.rel='noopener';cell.append(link,e('span',' '));}catch{}}}detail.append(cell);$('tableBody').append(detail);}

function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),link=e('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(v){if(v===null||v===undefined)v='';if(typeof v!=='number'&&/^[\s]*[=+@\-]/.test(String(v)))v="'"+v;return '"'+String(v).replace(/"/g,'""')+'"';}
$('title').textContent=D.title;$('summary').textContent=D.summary;$('scope').textContent=D.scope||'';$('eyebrow').textContent=D.eyebrow||'INTERACTIVE REPORT';$('snapshot').textContent=D.snapshot||'';$('synthetic').hidden=!D.synthetic;$('universeCount').textContent=D.rows.length;$('facetTitle').textContent=D.facet.label;$('parentChartTitle').textContent=D.facet.label+' · 记录分布';$('childChartPanel').hidden=!D.drilldown;$('chartNote').textContent=D.drilldown?'上层图按搜索结果计数，下层图按上层选择计数；点击柱条继续收紧明细。更换上层会清除下层选择。':'分类图按搜索结果计数；点击柱条筛选，再次点击取消。';$('pairedMini').hidden=$('deltaMini').hidden=!C;$('pairingNote').textContent=C?C.pairingNote:'未配置同项比较；当前只显示分类、记录和来源。';if(C)$('deltaUnit').textContent='平均改善 / '+C.deltaUnit;
const all=e('option','全部');all.value='';$('facetSelect').append(all);for(const [name]of groups(D.rows,D.facet.field)){const option=e('option',name);option.value=name;$('facetSelect').append(option);}const head=e('tr');for(const c of D.columns)head.append(e('th',c.label,c.numeric?'number':''));if(C)head.append(e('th','改善 / '+C.deltaUnit,'number'));head.append(e('th','证据'));$('tableHead').append(head);
$('query').oninput=event=>{state.query=event.target.value;state.page=0;render();};$('facetSelect').onchange=event=>changeParent(event.target.value);$('clear').onclick=()=>{state.query=state.parent=state.child='';state.page=0;$('query').value='';render();};$('previous').onclick=()=>{state.page--;render();};$('next').onclick=()=>{state.page++;render();};
$('exportCsv').onclick=()=>{const rows=analyze().rows,headers=[...D.columns.map(c=>c.label),...(C?['改善 / '+C.deltaUnit]:[]),'判定说明','当前条件'];const selection=$('selection').textContent;download('filtered-records.csv','\ufeff'+[headers.map(csv).join(','),...rows.map(r=>[...D.columns.map(c=>r[c.field]),...(C?[difference(r)]:[]),reason(r),selection].map(csv).join(','))].join('\r\n'),'text/csv;charset=utf-8');};
$('exportState').onclick=()=>{const a=analyze();download('report-view.json',JSON.stringify({viewSchemaVersion:1,exampleSchemaVersion:D.exampleSchemaVersion,snapshot:D.snapshot,synthetic:D.synthetic,filters:{...state},comparison:C,matched:a.rows.length,paired:a.pairs.length,rows:a.rows},null,2),'application/json');};render();window.REPORT_READY=true;
</script></body></html>
