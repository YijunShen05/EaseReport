<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>__STYLE__
:root{__THEME__}.report-pair{display:grid;grid-template-columns:1fr 1fr;gap:25px}.report-pair p{margin:3px 0}.report-pair strong{font:600 32px var(--report-mono)}.report-journey{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--report-muted);margin-top:22px}.report-journey b{color:var(--report-accent)}.report-selected{font-size:13px;color:var(--report-accent);overflow-wrap:anywhere}.report-downloads{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:520px){.report-pair{gap:15px}.report-pair strong{font-size:27px}}</style></head>
<body><div class="report-shell"><header class="report-mast"><span id="eyebrow" class="report-eyebrow"></span><span id="snapshot" class="report-muted"></span></header><main><div class="report-hero"><div><span id="synthetic" class="report-pill" hidden>合成演示 · 不代表真实成绩</span><h1 id="title"></h1><p id="summary" class="report-lead"></p><p id="scope" class="report-note"></p></div><aside class="report-summary"><div id="matchCount" class="report-number"></div><div>当前命中记录</div><p id="selection" class="report-selected" aria-live="polite"></p><div class="report-mini"><div><b id="universeCount"></b><span>登记记录</span></div><div id="pairedMini"><b id="pairedN"></b><span>同项有效 N</span></div><div id="deltaMini"><b id="deltaMean"></b><span id="deltaUnit"></span></div></div></aside></div>
<section class="report-section"><div class="report-section-head"><h2>先看清比较口径</h2><span class="report-index">01 / SCOPE</span></div><div class="report-layout"><div><p id="pairingNote" class="report-note"></p><div id="pairSummary" class="report-pair"></div><p id="pairPolicy" class="report-note"></p></div><div class="report-callout"><h3>从分布直接进入明细</h3><p>选择上层分组，再选择具体项目。图表、命中量和明细同步变化；展开查看原文与有效性。</p><div class="report-journey"><span><b>01</b> 看总览</span><span><b>02</b> 点图收紧</span><span><b>03</b> 展开核对</span></div></div></div></section>
<section class="report-section"><div class="report-section-head"><h2>选择你想了解的部分</h2><span class="report-index">02 / EXPLORE</span></div><div class="report-tools"><label>搜索记录<input id="query" type="search" placeholder="名称、状态或字段内容"></label><label id="facetLabel"><span id="facetTitle"></span><select id="facetSelect" aria-label="上层分类"></select></label><span class="report-spacer"></span><button id="clear" type="button">清除筛选</button></div><p id="chartNote" class="report-note"></p><div class="report-layout"><div><h3 id="parentChartTitle"></h3><div id="parentChart" class="report-bars"></div></div><div id="childChartPanel"><h3 id="childChartTitle"></h3><div id="childChart" class="report-bars"></div></div></div></section>
<section id="details" class="report-section"><div class="report-section-head"><h2>明细与证据</h2><span class="report-index">03 / DETAILS</span></div><div class="report-tools"><p id="tableStatus" class="report-live" aria-live="polite"></p><span class="report-spacer"></span><div class="report-downloads"><button id="exportCsv" type="button">导出命中 CSV</button><button id="exportState" type="button">导出当前视图 JSON</button></div></div><div class="report-table-wrap"><table class="report-table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="report-pagination"><span id="pageInfo"></span><div><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button></div></div><p class="report-note">分页只改变可见行，统计和导出使用完整命中集合。缺失显示“未提供”；有效零保留为零。</p></section></main><footer class="report-footer">可离线打开 · 数据不自动上传 · 主题与领域字段分别配置</footer></div>
<script id="report-data" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),C=D.comparison,$=id=>document.getElementById(id);
const state={query:'',parent:'',child:'',page:0},expanded=new Set(),pageSize=D.pageSize||8,precision=C?C.precision:2;
const e=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;};
const field=(r,key)=>r[key]===null||r[key]===undefined?'未提供':String(r[key]);
const category=(r,key)=>r[key]===null||r[key]===undefined||r[key]===''?'未登记':String(r[key]);
const number=v=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:precision}).format(v);
function valid(r,m){return typeof r[m.field]==='number'&&Number.isFinite(r[m.field])&&(!m.statusField||r[m.statusField]===m.validStatus);}
function difference(r){if(!C||!valid(r,C.baseline)||!valid(r,C.candidate))return null;return C.direction==='higher'?r[C.candidate.field]-r[C.baseline.field]:r[C.baseline.field]-r[C.candidate.field];}
function reason(r){if(!C)return '未配置配对分析；按原字段查看。';if(difference(r)!==null)return '双方同项数值及状态有效；正差值表示此指标改善。';return '缺失或状态不满足有效条件；不补零、不计算同项差值。';}
function groups(rows,key){const m=new Map();rows.forEach(r=>{const k=category(r,key);m.set(k,(m.get(k)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));}
function analyze(){const q=state.query.toLocaleLowerCase(),base=D.rows.filter(r=>!q||D.columns.map(c=>field(r,c.field)).join(' ').toLocaleLowerCase().includes(q));const parent=base.filter(r=>!state.parent||category(r,D.facet.field)===state.parent);const rows=parent.filter(r=>!state.child||!D.drilldown||category(r,D.drilldown.field)===state.child);const pairs=C?rows.filter(r=>difference(r)!==null):[];return {base,parent,rows,pairs};}
function changeParent(value){state.parent=value;state.child='';state.page=0;render();}
function bars(target,items,selected,action){target.replaceChildren();if(!items.length){target.append(e('p','当前条件下没有分组。','report-empty'));return;}const max=Math.max(...items.map(x=>x[1]));for(const [name,count]of items){const b=e('button',undefined,'report-bar');b.type='button';b.dataset.value=name;b.setAttribute('aria-pressed',String(name===selected));b.setAttribute('aria-label',name+'，'+count+'条记录');b.append(e('span',name,'report-bar-label'));const track=e('span',undefined,'report-bar-track'),fill=e('span',undefined,'report-bar-fill');fill.style.width=(100*count/max)+'%';track.append(fill);b.append(track,e('span',count,'report-bar-value'));b.onclick=()=>action(name===selected?'':name);target.append(b);}}
function render(){const a=analyze();$('matchCount').textContent=number(a.rows.length);$('selection').textContent=[state.parent&&D.facet.label+'：'+state.parent,state.child&&D.drilldown.label+'：'+state.child,state.query&&'搜索：'+state.query].filter(Boolean).join(' / ')||'全部登记记录';$('facetSelect').value=state.parent;bars($('parentChart'),groups(a.base,D.facet.field),state.parent,changeParent);if(D.drilldown){$('childChartTitle').textContent=(state.parent?state.parent+' · ':'')+D.drilldown.label;bars($('childChart'),groups(a.parent,D.drilldown.field),state.child,value=>{state.child=value;state.page=0;render();$('details').scrollIntoView({behavior:'auto',block:'start'});});}if(C){$('pairedN').textContent=a.pairs.length;$('deltaMean').textContent=a.pairs.length?number(a.pairs.reduce((sum,r)=>sum+difference(r),0)/a.pairs.length):'—';$('pairSummary').replaceChildren();for(const m of [C.baseline,C.candidate]){const box=e('div');box.append(e('p',m.label,'report-muted'),e('strong',a.pairs.length?number(a.pairs.reduce((sum,r)=>sum+r[m.field],0)/a.pairs.length):'—'),e('p',C.unit+' · 共同有效 N='+a.pairs.length,'report-note'));$('pairSummary').append(box);}$('pairPolicy').textContent=a.pairs.length?'同项有效集合均值；正差值表示改善，不代表统计显著。':'当前无同项有效值；不推算改善均值。';}
const pages=Math.ceil(a.rows.length/pageSize);state.page=Math.min(state.page,Math.max(0,pages-1));$('tableStatus').textContent='命中 '+a.rows.length+' 条'+(C?' · 同项有效 '+a.pairs.length+' 条':'');$('tableBody').replaceChildren();const count=D.columns.length+(C?1:0)+1;
for(const row of a.rows.slice(state.page*pageSize,(state.page+1)*pageSize)){const id=String(row[D.idField]),index=D.rows.indexOf(row),tr=e('tr');tr.dataset.rowId=id;for(const c of D.columns){const value=row[c.field];tr.append(e('td',typeof value==='number'?number(value):field(row,c.field),c.numeric?'number':''));}if(C)tr.append(e('td',difference(row)===null?'不适用':number(difference(row)), 'number'));const td=e('td'),button=e('button',expanded.has(id)?'收起证据':'展开证据');button.type='button';button.setAttribute('aria-expanded',String(expanded.has(id)));button.setAttribute('aria-controls','detail-'+index);button.onclick=()=>{expanded.has(id)?expanded.delete(id):expanded.add(id);render();};td.append(button);tr.append(td);$('tableBody').append(tr);const detail=e('tr');detail.id='detail-'+index;detail.hidden=!expanded.has(id);const cell=e('td',undefined,'detail-cell');cell.colSpan=count;cell.append(e('p',reason(row)),e('p',D.detailsField?field(row,D.detailsField):'未提供额外说明。'));if(D.sourcesField){for(const source of row[D.sourcesField]||[]){try{const url=new URL(source.url);if(!['https:','http:'].includes(url.protocol))continue;const link=e('a',source.label||'资料来源');link.href=url.href;link.target='_blank';link.rel='noopener';cell.append(link,e('span',' '));}catch{}}}detail.append(cell);$('tableBody').append(detail);}
if(!a.rows.length){const tr=e('tr'),td=e('td','没有符合当前条件的记录；可清除筛选后重试。');td.colSpan=count;tr.append(td);$('tableBody').append(tr);}$('pageInfo').textContent=a.rows.length?(state.page*pageSize+1)+'–'+Math.min((state.page+1)*pageSize,a.rows.length)+' / '+a.rows.length:'0 / 0';$('previous').disabled=state.page===0;$('next').disabled=(state.page+1)*pageSize>=a.rows.length;$('exportCsv').disabled=!a.rows.length;}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),link=e('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(v){if(v===null||v===undefined)v='';if(typeof v!=='number'&&/^[\s]*[=+@\-]/.test(String(v)))v="'"+v;return '"'+String(v).replace(/"/g,'""')+'"';}
$('title').textContent=D.title;$('summary').textContent=D.summary;$('scope').textContent=D.scope||'';$('eyebrow').textContent=D.eyebrow||'INTERACTIVE REPORT';$('snapshot').textContent=D.snapshot||'';$('synthetic').hidden=!D.synthetic;$('universeCount').textContent=D.rows.length;$('facetTitle').textContent=D.facet.label;$('parentChartTitle').textContent=D.facet.label+' · 记录分布';$('childChartPanel').hidden=!D.drilldown;$('chartNote').textContent=D.drilldown?'上层图按搜索结果计数，下层图按上层选择计数；点击柱条继续收紧明细。更换上层会清除下层选择。':'分类图按搜索结果计数；点击柱条筛选，再次点击取消。';$('pairedMini').hidden=$('deltaMini').hidden=!C;$('pairingNote').textContent=C?C.pairingNote:'未配置同项比较；当前只显示分类、记录和来源。';if(C)$('deltaUnit').textContent='平均改善 / '+C.deltaUnit;
const all=e('option','全部');all.value='';$('facetSelect').append(all);for(const [name]of groups(D.rows,D.facet.field)){const option=e('option',name);option.value=name;$('facetSelect').append(option);}const head=e('tr');for(const c of D.columns)head.append(e('th',c.label,c.numeric?'number':''));if(C)head.append(e('th','改善 / '+C.deltaUnit,'number'));head.append(e('th','证据'));$('tableHead').append(head);
$('query').oninput=event=>{state.query=event.target.value;state.page=0;render();};$('facetSelect').onchange=event=>changeParent(event.target.value);$('clear').onclick=()=>{state.query=state.parent=state.child='';state.page=0;$('query').value='';render();};$('previous').onclick=()=>{state.page--;render();};$('next').onclick=()=>{state.page++;render();};
$('exportCsv').onclick=()=>{const rows=analyze().rows,headers=[...D.columns.map(c=>c.label),...(C?['改善 / '+C.deltaUnit]:[]),'判定说明','当前条件'];const selection=$('selection').textContent;download('filtered-records.csv','\ufeff'+[headers.map(csv).join(','),...rows.map(r=>[...D.columns.map(c=>r[c.field]),...(C?[difference(r)]:[]),reason(r),selection].map(csv).join(','))].join('\r\n'),'text/csv;charset=utf-8');};
$('exportState').onclick=()=>{const a=analyze();download('report-view.json',JSON.stringify({viewSchemaVersion:1,exampleSchemaVersion:D.exampleSchemaVersion,snapshot:D.snapshot,synthetic:D.synthetic,filters:{...state},comparison:C,matched:a.rows.length,paired:a.pairs.length,rows:a.rows},null,2),'application/json');};render();window.REPORT_READY=true;
</script></body></html>
